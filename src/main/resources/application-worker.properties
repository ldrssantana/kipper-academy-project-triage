# Processo "worker" (SPEC 3): consumidor da fila. Sem servidor web, para poder rodar
# ao mesmo tempo que o ingestion na mesma maquina sem conflito de porta.
# Rodar com: ./gradlew bootRun --args='--spring.profiles.active=worker'
spring.main.web-application-type=none

# Um evento por vez, buscando um de cada vez no broker: a fila "esvazia" de forma visivel
# na UI do RabbitMQ durante a demo, e nao ha corrida entre eventos da mesma issue.
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.prefetch=1

# Falha ao processar: tenta de novo com backoff (ex.: banco piscou). Esgotadas as tentativas,
# a mensagem e rejeitada SEM requeue e cai na DLQ, em vez de girar em loop infinito.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.default-requeue-rejected=false
