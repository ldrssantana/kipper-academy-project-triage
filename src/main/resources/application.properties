spring.application.name=Kipper_Academy

# Le o .env da raiz do projeto (se existir) como fonte de propriedades.
# As chaves do .env sao referenciadas abaixo via ${...}, com default para dev local.
spring.config.import=optional:file:.env[.properties]

# --- Banco (Postgres do docker-compose) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kipper_academy}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:kipper}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changeme}

# Schema e catalogo vem de schema.sql / data.sql (versionados e explicitos,
# incluindo as constraints UNIQUE que sustentam a idempotencia).
# O Hibernate so valida que as entidades batem com o schema; nunca altera o banco.
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- RabbitMQ (do docker-compose) ---
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

# Publisher confirms: a ingestao so responde 202 depois que o broker confirma a mensagem.
spring.rabbitmq.publisher-confirm-type=simple

# --- Topologia da fila (SPEC 3.1), compartilhada por ingestion e worker ---
app.messaging.exchange=kipper.issue-events
app.messaging.queue=kipper.issue-events.triage
app.messaging.routing-key=issue-event
app.messaging.dead-letter-queue=kipper.issue-events.triage.dlq
app.messaging.confirm-timeout=5s
